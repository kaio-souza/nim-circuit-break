name: Benchmarks

# Informational: publishes the numbers and never fails the build.
# The regression gate is benchcheck.yml (ADR-0020); this one also covers the
# thread, async and Chronos suites, which are too noisy to gate.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: nimlang/nim:2.2.4
    steps:
      - uses: actions/checkout@v4

      - name: Allow git in the container workspace (nimble reads the revision)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run benchmarks and publish them to the job summary
        shell: bash
        run: |
          nimble bench -y 2>&1 | tee /tmp/bench.txt
          {
            echo "## Benchmarks"
            echo
            echo "Commit: $GITHUB_SHA"
            echo '```'
            grep -E '^(##|BM|benchmark| +[0-9]|threads)' /tmp/bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
