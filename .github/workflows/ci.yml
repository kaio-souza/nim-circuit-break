name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (nim ${{ matrix.nim }}, ${{ matrix.mm }}, threads=${{ matrix.threads }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Official Nim image pinned by version: no third-party actions.
    container: nimlang/nim:${{ matrix.nim }}
    strategy:
      fail-fast: false
      matrix:
        # 2.2.4: oldest 2.2 supported by the test dependencies; 2.2.14: latest
        # 2.2; 2.4.0: newest 2.4 image (2.4.2 is covered on macOS and Windows).
        nim: ['2.2.4', '2.2.14', '2.4.0']
        mm: [orc, arc]
        threads: ['on', 'off']
    steps:
      - uses: actions/checkout@v4

      - name: Allow git in the container workspace (nimble reads the revision)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Tests (release)
        run: nimble test -y --mm:${{ matrix.mm }} --threads:${{ matrix.threads }} -d:release

      - name: Tests (debug, with runtime checks)
        run: nimble test -y --mm:${{ matrix.mm }} --threads:${{ matrix.threads }}

  test-devel:
    # A heads-up for upcoming Nim changes, not a release gate. The
    # nimlang/nim:devel image is stale (old glibc and nimble), so this uses the
    # official nightly build from nim-lang/nightlies.
    name: test (nim devel, orc, threads=on)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim devel (official nightly)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download latest-devel -R nim-lang/nightlies -p 'linux_x64.tar.xz' -D "$RUNNER_TEMP"
          tar xJf "$RUNNER_TEMP/linux_x64.tar.xz" -C "$RUNNER_TEMP"
          echo "$(ls -d "$RUNNER_TEMP"/nim-*/)bin" >> "$GITHUB_PATH"
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      - name: Nim version
        run: nim --version

      - name: Tests (release)
        run: nimble test -y --mm:orc --threads:on -d:release

      - name: Tests (debug, with runtime checks)
        run: nimble test -y --mm:orc --threads:on

  test-nim-2-0:
    # The package supports Nim 2.0, but proptest and nim-linear (test-only)
    # need Nim 2.2, so `nimble test` cannot resolve them here: every test
    # except the model and linearizability tests (t_linearizable*) runs directly with nim. Official binary from nim-lang.org, pinned.
    name: test (nim 2.0.16, orc, threads=on, no model/linearizability test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NIM_VERSION: 2.0.16
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        run: |
          curl -sSfL "https://nim-lang.org/download/nim-${NIM_VERSION}-linux_x64.tar.xz" | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nim-${NIM_VERSION}/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      - name: Install Chronos (optional module, tested by t_chronos)
        run: nimble install -y chronos

      - name: Tests (release and debug)
        run: |
          for f in tests/t*.nim; do
            [ "$f" = tests/t_model.nim ] && continue
            [ "$f" = tests/t_linearizable.nim ] && continue
            [ "$f" = tests/t_linearizable_sched.nim ] && continue
            nim c -r --hints:off --threads:on -d:release "$f"
            nim c -r --hints:off --threads:on "$f"
          done

  test-os:
    name: test (${{ matrix.os }}, nim ${{ matrix.nim }}, orc, threads=on)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Official Windows binary from nim-lang.org, pinned.
          - os: windows-latest
            nim: 2.4.2
          # nim-lang.org ships no macOS binary: Homebrew's current Nim.
          - os: macos-latest
            nim: brew
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim (Windows)
        if: runner.os == 'Windows'
        # PowerShell: Expand-Archive is always there; unzip is not guaranteed.
        # The C compiler is the MinGW-w64 gcc preinstalled on the runner.
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "nim.zip"
          Invoke-WebRequest -Uri "https://nim-lang.org/download/nim-${{ matrix.nim }}_x64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP "nim-${{ matrix.nim }}\bin")
          Add-Content $env:GITHUB_PATH (Join-Path $env:USERPROFILE ".nimble\bin")

      - name: Install Nim (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install nim
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      - name: Nim version
        run: nim --version

      - name: Tests (release)
        run: nimble test -y --mm:orc --threads:on -d:release

      - name: Tests (debug, with runtime checks)
        run: nimble test -y --mm:orc --threads:on

  examples-and-docs:
    name: examples and docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: nimlang/nim:2.2.4
    steps:
      - uses: actions/checkout@v4

      - name: Install Chronos (optional module, examples and docs check)
        run: nimble install -y chronos

      - name: Build all examples
        run: |
          for f in examples/*.nim; do
            [ -e "$f" ] || continue
            nim c --mm:orc -d:release -o:/tmp/example_bin "$f"
          done

      - name: Generate API documentation
        run: nim doc --project --outdir:/tmp/htmldocs src/circuit_breaker.nim

      - name: Traceability matrix (EV1/EV2)
        run: nim r --hints:off scripts/check_traceability.nim

      - name: Public API fully documented (D3)
        run: nim r --hints:off scripts/check_docs.nim

  warnings:
    name: zero warnings in src/ (criterion 2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: nimlang/nim:2.2.4
    steps:
      - uses: actions/checkout@v4

      - name: Install Chronos (so its module is checked too)
        run: nimble install -y chronos

      - name: Type-check every module in every mode
        run: nim r --hints:off scripts/check_warnings.nim

  quickstart:
    name: README quickstart after nimble install (D1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: nimlang/nim:2.2.4
    steps:
      - uses: actions/checkout@v4

      - name: Allow git in the container workspace (nimble reads the revision)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install the package from the checkout
        run: nimble install -y

      - name: Build the README snippets against the installed package
        # Run from a scratch directory: nothing resolves through ../src.
        run: |
          work=$(mktemp -d)
          cd "$work"
          nim r --hints:off "$GITHUB_WORKSPACE/scripts/check_readme.nim" "$work/snippets"

  tsan:
    name: ThreadSanitizer (concurrency tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: nimlang/nim:2.2.4
      # TSan cannot map its shadow memory with the runner's high ASLR entropy
      # ("unexpected memory mapping"); setarch -R turns ASLR off for the test
      # binaries, which needs the personality syscall that seccomp blocks.
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v4

      - name: Allow git in the container workspace (nimble reads the revision)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install test dependencies
        run: nimble install -y https://github.com/kaio-souza/nim-proptest@'>= 1.0.0' https://github.com/kaio-souza/nim-linear chronos

      - name: Run the thread tests under ThreadSanitizer (gcc)
        # Any TSan report fails the step (exitcode=66, halt_on_error=1).
        env:
          TSAN_OPTIONS: halt_on_error=1:exitcode=66
        run: |
          for t in t_concurrency t_linearizable t_keyed; do
            nim c --hints:off --threads:on --mm:orc -d:release --debugger:native \
              --passC:-fsanitize=thread --passL:-fsanitize=thread \
              -o:/tmp/tsan_$t tests/$t.nim
            setarch "$(uname -m)" -R /tmp/tsan_$t
          done

  coverage:
    name: coverage (Q7)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: nimlang/nim:2.2.4
    steps:
      - uses: actions/checkout@v4

      - name: Allow git in the container workspace (nimble reads the revision)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install test dependencies and lcov
        run: |
          nimble install -y https://github.com/kaio-souza/nim-proptest@'>= 1.0.0' https://github.com/kaio-souza/nim-linear chronos
          apt-get update -qq && apt-get install -y -qq lcov

      - name: Measure and report
        run: scripts/coverage.sh >> "$GITHUB_STEP_SUMMARY"
