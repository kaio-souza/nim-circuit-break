name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (nim ${{ matrix.nim }}, ${{ matrix.mm }}, threads=${{ matrix.threads }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Official Nim image pinned by version: no third-party actions.
    container: nimlang/nim:${{ matrix.nim }}
    # devel is a heads-up for upcoming Nim changes, not a release gate.
    continue-on-error: ${{ matrix.nim == 'devel' }}
    strategy:
      fail-fast: false
      matrix:
        # 2.2.4: oldest 2.2 supported by the test dependencies; 2.2.14: latest
        # 2.2; 2.4.0: newest 2.4 image (2.4.2 is covered on macOS and Windows).
        nim: ['2.2.4', '2.2.14', '2.4.0']
        mm: [orc, arc]
        threads: ['on', 'off']
        include:
          - nim: devel
            mm: orc
            threads: 'on'
    steps:
      - uses: actions/checkout@v4

      - name: Allow git in the container workspace (nimble reads the revision)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Tests (release)
        run: nimble test -y --mm:${{ matrix.mm }} --threads:${{ matrix.threads }} -d:release

      - name: Tests (debug, with runtime checks)
        run: nimble test -y --mm:${{ matrix.mm }} --threads:${{ matrix.threads }}

  test-nim-2-0:
    # The package supports Nim 2.0, but proptest (test-only) needs 2.2.4, so
    # `nimble test` cannot resolve it here: every test except the model test
    # runs directly with nim. Official binary from nim-lang.org, pinned.
    name: test (nim 2.0.16, orc, threads=on, no model test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NIM_VERSION: 2.0.16
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        run: |
          curl -sSfL "https://nim-lang.org/download/nim-${NIM_VERSION}-linux_x64.tar.xz" | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nim-${NIM_VERSION}/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      - name: Install Chronos (optional module, tested by t_chronos)
        run: nimble install -y chronos

      - name: Tests (release and debug)
        run: |
          for f in tests/t*.nim; do
            [ "$f" = tests/t_model.nim ] && continue
            nim c -r --hints:off --threads:on -d:release "$f"
            nim c -r --hints:off --threads:on "$f"
          done

  test-os:
    name: test (${{ matrix.os }}, nim ${{ matrix.nim }}, orc, threads=on)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Official Windows binary from nim-lang.org, pinned.
          - os: windows-latest
            nim: 2.4.2
          # nim-lang.org ships no macOS binary: Homebrew's current Nim.
          - os: macos-latest
            nim: brew
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim (Windows)
        if: runner.os == 'Windows'
        # PowerShell: Expand-Archive is always there; unzip is not guaranteed.
        # The C compiler is the MinGW-w64 gcc preinstalled on the runner.
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "nim.zip"
          Invoke-WebRequest -Uri "https://nim-lang.org/download/nim-${{ matrix.nim }}_x64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP "nim-${{ matrix.nim }}\bin")
          Add-Content $env:GITHUB_PATH (Join-Path $env:USERPROFILE ".nimble\bin")

      - name: Install Nim (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install nim
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      - name: Nim version
        run: nim --version

      - name: Tests (release)
        run: nimble test -y --mm:orc --threads:on -d:release

      - name: Tests (debug, with runtime checks)
        run: nimble test -y --mm:orc --threads:on

  examples-and-docs:
    name: examples and docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: nimlang/nim:2.2.4
    steps:
      - uses: actions/checkout@v4

      - name: Install Chronos (optional module, examples and docs check)
        run: nimble install -y chronos

      - name: Build all examples
        run: |
          for f in examples/*.nim; do
            [ -e "$f" ] || continue
            nim c --mm:orc -d:release -o:/tmp/example_bin "$f"
          done

      - name: Generate API documentation
        run: nim doc --project --outdir:/tmp/htmldocs src/circuit_breaker.nim

      - name: Traceability matrix (EV1/EV2)
        run: nim r --hints:off scripts/check_traceability.nim

      - name: Public API fully documented (D3)
        run: nim r --hints:off scripts/check_docs.nim
